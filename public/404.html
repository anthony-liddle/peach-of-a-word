<!doctype html>
<html lang="en" data-theme="cute">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found | Peach of a Word</title>
    <meta name="robots" content="noindex" />
    <!-- Vercel serves this for any address the site doesn't have, with a 404.
         Icons and theme follow the same contract as the other pages. -->
    <link
      rel="icon"
      id="favicon"
      href="/favicon-cute.svg"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      /* The two theme palettes, the support page's tokens. */
      :root,
      [data-theme='letterpress'] {
        --paper: #f1eee6;
        --ink: #211d17;
        --accent: #9d2b25;
        --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
        --weight-display: 700;
        --font-body: 'Spectral', Georgia, serif;
      }
      [data-theme='cute'] {
        --paper: #fff4ee;
        --ink: #6b4636;
        --accent: #c42e60;
        --font-display: 'Fredoka', ui-rounded, system-ui, sans-serif;
        --weight-display: 600;
        --font-body: 'Nunito', ui-rounded, system-ui, sans-serif;
      }
      /* Cocoa, the game's dark, for the same tokens: drawn when the script
         below finds the page dark, by the game's own rule. Letterpress has no
         dark yet. standaloneHtml.test.ts holds each value to src/index.css. */
      [data-theme='cute'][data-appearance='dark'] {
        --paper: #2b1a14;
        --ink: #ffeadf;
        --accent: #ff8bae;
      }
      body {
        margin: 0;
        padding: 2.5rem 1.25rem 4rem;
        font-family: var(--font-body);
        color: var(--ink);
        background: var(--paper);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
      }
      h1 {
        font-family: var(--font-display);
        font-weight: var(--weight-display);
        font-size: 1.75rem;
        margin: 0 0 1rem;
      }
      a {
        color: var(--accent);
      }
    </style>
    <script>
      // Match the theme the player already chose, read from the same key the
      // game writes. Wrapped because localStorage throws outright in some
      // privacy modes. The theme and the tab icon are resolved together, the
      // same as index.html and the other pages.
      (function () {
        var DEFAULT = 'cute';
        var saved;
        try {
          saved = localStorage.getItem('e8-theme');
        } catch (e) {
          saved = null; /* storage blocked: fall back to the default */
        }
        var theme =
          saved === 'cute' || saved === 'letterpress' ? saved : DEFAULT;
        document.documentElement.dataset.theme = theme;
        var icon = document.getElementById('favicon');
        if (icon)
          icon.href =
            theme === 'cute' ? '/favicon-cute.svg' : '/favicon-classic.svg';
        // The appearance, by index.html's rule: System follows the computer
        // or phone, Light and Dark are the player's choice in the game, and
        // only cute has a dark. Set before the first paint, and again when
        // the system changes, so a page left open follows it as the game does.
        var appearance;
        try {
          appearance = localStorage.getItem('e8-appearance');
        } catch (e) {
          appearance = null;
        }
        var system = null;
        try {
          system = window.matchMedia('(prefers-color-scheme: dark)');
        } catch (e) {
          system = null;
        }
        var paint = function () {
          var dark =
            theme === 'cute' &&
            (appearance === 'dark' ||
              (appearance !== 'light' && !!system && system.matches));
          var root = document.documentElement;
          root.dataset.appearance = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';
        };
        paint();
        if (system && system.addEventListener)
          system.addEventListener('change', paint);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>There's nothing at this address.</h1>
      <p><a href="/">Back to today's board</a></p>
    </main>
  </body>
</html>

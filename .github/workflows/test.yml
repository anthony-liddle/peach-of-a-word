name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The word lists are a committed copy of an orchard release, which is what
      # keeps this build offline and reproducible. The cost of a committed copy
      # is that it can drift from the release it claims to be, so the claim is
      # checked. Offline and no network: it hashes the committed files against
      # scripts/lexicon.lock.json.
      - run: pnpm lexicon:check

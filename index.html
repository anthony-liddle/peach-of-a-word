<!doctype html>
<html lang="en" data-theme="cute">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peach of a Word</title>
    <meta
      name="description"
      content="Make words from eight scrambled letters, then find the long word they all came from. A new puzzle daily."
    />
    <!-- Light and dark. The canvas is dark before any stylesheet when the
         computer or phone is, and the address bar is the page's colour: Cocoa
         in dark, the peach-cream in light. The script below pins both to the
         page's own appearance, which a player's choice or letterpress can
         make differ from the system's; these are what a browser that never
         runs it falls back on. -->
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#fff4ee"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#2b1a14"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Icons: the tab icon follows the theme. It is set before the first paint
         by the script below and swapped on toggle. The default is the cute
         peach, the default theme, so a fresh visitor never sees a stale icon. -->
    <link
      rel="icon"
      id="favicon"
      href="/favicon-cute.svg"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // No-flash theme and tab icon: resolve the saved theme (or the default)
      // and apply both to the document and the favicon before the first paint,
      // so a fresh visitor never sees the wrong theme or a stale icon.
      (function () {
        var DEFAULT = 'cute';
        var saved;
        try {
          saved = localStorage.getItem('e8-theme');
        } catch (e) {
          saved = null; /* storage blocked: fall back to the default */
        }
        var theme =
          saved === 'cute' || saved === 'letterpress' ? saved : DEFAULT;
        document.documentElement.dataset.theme = theme;
        var icon = document.getElementById('favicon');
        if (icon)
          icon.href =
            theme === 'cute' ? '/favicon-cute.svg' : '/favicon-classic.svg';
        // Saved text size, same no-flash contract as the theme. Only the
        // larger steps set the attribute; regular (or anything unknown)
        // means no override, so the browser default rules alone.
        var size;
        try {
          size = localStorage.getItem('e8-text-size');
        } catch (e) {
          size = null;
        }
        if (size === 'large' || size === 'largest')
          document.documentElement.dataset.textSize = size;
        // The appearance, same no-flash contract: System follows the
        // computer or phone, Light and Dark are the player's, kept per device.
        // Only cute has a dark; letterpress is light in every appearance. The
        // root carries the result and its colour-scheme before the first
        // paint, so the first frame is already dark when it should be.
        // useAppearance.ts keeps it so, by the same rule.
        var appearance;
        try {
          appearance = localStorage.getItem('e8-appearance');
        } catch (e) {
          appearance = null;
        }
        var systemDark = false;
        try {
          systemDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
        } catch (e) {
          systemDark = false;
        }
        var dark =
          theme === 'cute' &&
          (appearance === 'dark' || (appearance !== 'light' && systemDark));
        var root = document.documentElement;
        root.dataset.appearance = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        var bars = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < bars.length; i++) {
          bars[i].removeAttribute('media');
          bars[i].setAttribute('content', dark ? '#2b1a14' : '#fff4ee');
        }
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Peach of a Word" />
    <meta property="og:title" content="Peach of a Word" />
    <meta
      property="og:description"
      content="Make words from eight scrambled letters, then find the long word they all came from. A new puzzle daily."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The wordmark Peach of a Word in the cute theme: a smiling cartoon peach above the name in rounded type, over a row of soft letter tiles, one in peach."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Peach of a Word" />
    <meta
      name="twitter:description"
      content="Make words from eight scrambled letters, then find the long word they all came from. A new puzzle daily."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
